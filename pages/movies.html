<div>
    <h2 class="section-title"><i class="fa-solid fa-film" style="color:var(--accent-red);"></i> Movies & Releases</h2>
    <div class="fusion-grid">
        <a ng-repeat="item in moviesList" ng-href="#!/news/{{ item.id }}" class="fusion-card">
            <div class="fusion-poster">
                <div class="glass-tag"><span class="tag-dot"></span> MOVIES</div>
                <div class="pin-badge" ng-if="item.pinned"><i class="fa-solid fa-thumbtack"></i> Pinned</div>
                <img ng-src="{{ item.image }}" alt="{{ item.title }}">
                <div class="glass-rating"><i class="fa-solid fa-star"></i> {{ item.rating }}</div>
            </div>
            <div class="fusion-info">
                <div class="fusion-title">{{ item.title }}</div>
                <div class="fusion-meta">
                    <span>{{ item.category }}</span>
                    <span class="fusion-pill">{{ item.year }}</span>
                </div>
            </div>
        </a>
    </div>
</div>

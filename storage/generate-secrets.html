<!doctype html><html lang="en"><meta charset="utf-8"><title>Generate storage secrets locally</title>
<body><h1>Generate storage secrets</h1>
<p>Open this downloaded file on your computer. It generates values locally and sends nothing anywhere. Keep them private.</p>
<button id="generate">Generate new values</button>
<p>DRIVE_API_KEY</p><textarea id="key" cols="75" rows="2" readonly></textarea>
<p>SESSION_SECRET</p><textarea id="session" cols="75" rows="2" readonly></textarea>
<p>ADMIN_PASSWORD (for the website admin; this is not your Gmail password)</p><textarea id="password" cols="75" rows="2" readonly></textarea>
<script>
function secret() {
    var bytes = new Uint8Array(32); crypto.getRandomValues(bytes);
    return Array.prototype.map.call(bytes, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
}
document.getElementById('generate').onclick = function () {
    ['key', 'session', 'password'].forEach(function (id) { document.getElementById(id).value = secret(); });
};
</script></body></html>
